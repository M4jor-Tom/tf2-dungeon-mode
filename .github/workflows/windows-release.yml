name: Windows release

# Push a tag like v0.1.0 to publish a GitHub release. Run manually to just get the zip as a build artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022   # VS 2022 (v143) + Windows 11 SDK, as the SDK README requires
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5   # texttoarray.py runs during the server build
        with:
          python-version: "3.13"

      - uses: microsoft/setup-msbuild@v2

      # Only the "game" group (client, server, mod_tf launcher, and their libs). The "everything" group from
      # createallprojects.bat also builds the map/model tools, which a release doesn't ship.
      - name: Generate solution
        working-directory: src
        run: devtools\bin\vpc.exe /tf /win64 /define:SOURCESDK +game /mksln game.sln

      - name: Build
        working-directory: src
        run: msbuild game.sln /m /p:Configuration=Release /v:minimal

      - name: Package
        shell: pwsh
        run: |
          $name = "tf2-dungeon-mode-${{ github.ref_name }}-win64"
          $out = "dist\$name"
          New-Item -ItemType Directory -Force "$out\bin" | Out-Null
          Copy-Item -Recurse game\mod_tf "$out\mod_tf"
          Copy-Item -Recurse game\bin\x64 "$out\bin\x64"
          Copy-Item game\mod_tf_win64.exe, game\thirdpartylegalnotices.txt, README.md "$out\"
          Get-ChildItem -Recurse "$out" -Include *.pdb, *.map | Remove-Item
          Get-ChildItem -Recurse "$out\mod_tf\bin" -Filter linux64 -Directory | Remove-Item -Recurse
          foreach ($f in "mod_tf_win64.exe", "mod_tf\bin\x64\client.dll", "mod_tf\bin\x64\server.dll") {
            if (-not (Test-Path "$out\$f")) { throw "missing build output: $f" }
          }
          Compress-Archive -Path "$out\*" -DestinationPath "dist\$name.zip"
          "ZIP=dist\$name.zip" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: tf2-dungeon-mode-win64
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          body: |
            TF2 Dungeon Mode, Windows x64 build.

            Requires Team Fortress 2 and "Source SDK Base 2013 Multiplayer" installed through Steam.
            Unzip into a folder, then run `mod_tf_win64.exe` (or copy `mod_tf` into `Steam/steamapps/sourcemods/`).
